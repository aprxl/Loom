[package]
name = "loom"
description = "The Loom command-line tool: build, run, check, test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "loom"
path = "src/main.rs"

[features]
default = ["lua54"]
lua54 = ["loom_compiler/lua54", "loom_host/lua54"]
lua55 = ["loom_compiler/lua55", "loom_host/lua55"]
# Treadle with its run-time checks on (design/vm.md §5.6).
vm-checked = ["loom_vm/checked"]

[dependencies]
clap.workspace = true
loom_syntax.workspace = true
loom_compiler.workspace = true
loom_host.workspace = true
loom_isa.workspace = true
loom_vm.workspace = true

[lints]
workspace = true
