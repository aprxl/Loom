[package]
name = "loom_compiler"
description = "Everything semantic: resolution, type checking, analyses, lowering to Lua."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
loom_syntax.workspace = true
loom_isa.workspace = true
loom_sys.workspace = true
loom_vm.workspace = true
indexmap.workspace = true

[lints]
workspace = true

[dev-dependencies]
mlua.workspace = true
# The runtime's tests (`rt_int`, `rt_methods`) run its Lua in a VM.
loom_host = { workspace = true, features = ["lua54"] }
