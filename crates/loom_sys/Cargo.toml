[package]
name = "loom_sys"
description = "What a running Loom program gets from its host, for both backends: output, arguments, outcomes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# A WebAssembly build (the docs' playground) has no terminal and no Ctrl-C:
# `term` refuses raw mode and keys there, and `interrupt` installs no handler.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
crossterm.workspace = true
ctrlc.workspace = true

[lints]
workspace = true
